name: Actions
on:
  pull_request:
    branches:
      - development
jobs:
  lint:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      # install the latest of v11 to fix npm ci issues
      - run: npm i -g npm@11
      - name: Install Dependencies
        run: npm ci
      - name: Run linters
        run: npm run lint
      - name: Run Build
        run: npm run validate
      - name: Test
        run: npm test
